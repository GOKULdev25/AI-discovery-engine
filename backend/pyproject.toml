[project]
name = "ai-discovery-engine-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    "aiosqlite>=0.20",
    "duckdb>=1.1",
    "httpx>=0.27",
    "tenacity>=9.0",
    "PyYAML>=6.0",
    "python-multipart>=0.0.12",
    "google-play-scraper>=1.2.7",
    "asyncpraw>=7.7",
    "polars>=1.9",
    "xlsxwriter>=3.2",
    "pyarrow>=17.0",
    "fastembed>=0.8",
    "langdetect>=1.0.9",
    "vaderSentiment>=3.3",
    "simhash>=2.1",
    "playwright>=1.62",
    "selectolax>=0.4",
    "mcp>=1.29,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "openpyxl>=3.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
